<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found — {{ site.author.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="shortcut icon" href="{{ '/static/assets/img/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/static/assets/fork-awesome/css/fork-awesome.min.css' | relative_url }}">
    <script>
        // Apply the saved theme right away, before paint, to avoid a flash of the wrong theme.
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <section class="section container" style="text-align:center; padding-block: var(--space-8); max-width: 480px; margin-inline: auto;">
        <i class="fa fa-compass" aria-hidden="true" style="font-size: 2.5rem; color: var(--color-accent);"></i>
        <h1 style="font-size: var(--text-3xl); margin-block: var(--space-3);">404</h1>
        <p class="hero__lead">This page doesn't exist — or doesn't exist anymore. Either way, it's not here.</p>
        <p style="margin-top: var(--space-6);">
            <a class="btn btn--primary" href="{{ '/' | append: site.default_lang | append: '/' | relative_url }}">Back to homepage</a>
        </p>
    </section>
</body>
</html>
