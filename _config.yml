#
###################################
# Site wide configuration
####################################
#
title: Your Name — Resume & Blog
tagline: "Work and personal interests"
description: "The resume, work experience and blog of Your Name."
keywords: your-name, resume, cv, blog, jekyll, github-pages
baseurl: '/my-personal-resume-and-blog' # this repo's own GitHub Pages demo lives under this subpath; if you fork this as your own site, set it to '' (root) unless you're also hosting under a subpath — see the comment below
url: https://cristiancastellari.it # this repo's own GitHub Pages demo URL — note: if your <username>.github.io site has a custom domain, GitHub nests every project repo under that domain too (see the "Deploying" section below), so this is the domain that actually serves it, not the github.io one; replace with your own domain (or https://<username>.github.io for a project page) when you fork this
img_path: /static/assets/img/blog
favicon: /static/assets/img/favicon.svg # replace with your own favicon (svg, ico, or png all work)

#
###################################
# Jekyll configuration
####################################
#
timezone: Europe/Rome # change to your own timezone
highlighter: rouge
markdown: kramdown
excerpt_separator: <!--more-->

settings:
  rating: general # may be general, mature, restricted, 14 years or safe for kids

kramdown:
  input: GFM
  syntax_highlighter: rouge

#
###################################
# jekyll-seo-tag settings
####################################
#
lang: en_US
# Fallback language (short code) when a page/post doesn't set `lang`.
# The single place to change to move the site's default to another language.
# Languages shipped with this theme: it (Italian), en (English) — see the
# README for how to add, remove, or change languages.
default_lang: en
permalink: /blog/:categories/:title/

social:
  name: Your Name
  links:
    - https://github.com/your-username
    - https://www.linkedin.com/in/your-username/
    # add/remove links as needed — see _includes/footer.html and it/contatti.html /
    # en/contact.html for which of these are actually rendered as icons

twitter:
  card: summary
  username: your_twitter_handle

webmaster_verifications:
  # google: your-google-site-verification-code
  # bing: your-bing-site-verification-code

#
###################################
# author configuration
# used on the home page "about me" section, CV, and blog post byline
####################################
#
author: # replace every value below with your own information
  name: Your Name # used as the blog posts' author name
  first_name: Your # used on the home page hero
  last_name: Name # used on the home page hero
  avatar: /static/assets/img/avatar-placeholder.svg # replace with your own photo (jpg/png/svg all work)
  github_username: your-username # leave the value empty (just "github_username:") to hide this card/icon
  linkedin_id: your-linkedin-id
  facebook_username: # empty on purpose — Liquid treats "" as truthy but an unset key as falsy, so leave these with nothing after the colon to hide them
  twitter: # empty on purpose, see above
  bluesky: # e.g. yourhandle.bsky.social — empty on purpose, see above
  email: you@example.com
  cv: # link to a PDF version of your CV, if you want a download button; leave empty to hide it
  desc: "A short bio for the home page hero and CV intro. Two or three sentences about who you are and what you do."

# comments (Disqus)
disqus: # get your own shortname at https://disqus.com/, or comment out the two lines below to disable comments entirely
  name: your-disqus-shortname

# analytics
## google analytics
ga: # get your own measurement ID at https://www.google.com/analytics/, or leave the id commented out to disable
#  id: G-XXXXXXXXXX

## google optimize
go:
  # id:

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

# Blog pagination is handled by hand in _layouts/blog-index.html (not by a
# plugin) because it needs to filter posts by language — jekyll-paginate
# always paginates ALL site.posts, with no way to exclude other languages.
blog_posts_per_page: 15

# scss
sass:
  sass_dir: _sass
  style: compressed


# Build settings
encoding: utf-8

exclude: ['README.md', 'CHANGELOG.md', 'Gemfile', 'Gemfile.lock', 'node_modules']
